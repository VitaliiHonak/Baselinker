[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "baselinker-integration"
version = "0.1.0"
description = "Sync orders from Baselinker into the internal OrderService"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[project.scripts]
bl-sync = "sync:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
